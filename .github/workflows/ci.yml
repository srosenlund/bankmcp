# .github/workflows/ci.yml for a Sliplane repo (fleet docs/standard.md).
# Required check: "ci / gate".
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: srosenlund/fleet/.github/workflows/ci-node.yml@bb26901ac324a7bd958e69650c27959fc0a2d316
    with:
      node-version: '24'
      lint-command: npm run typecheck

  deploy:
    needs: ci
    if: github.event_name == 'push'
    uses: srosenlund/fleet/.github/workflows/deploy-sliplane.yml@bb26901ac324a7bd958e69650c27959fc0a2d316
    with:
      health-url: https://bankmcp.sliplane.app/healthz
    # Environment secrets reach the called job only through inherit.
    secrets: inherit # zizmor: ignore[secrets-inherit]

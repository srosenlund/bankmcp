name: auto-update
on:
  schedule:
    - cron: "23 4 * * 1" # mandag 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge upstream (noskillish/bankmcp) into PR branch
        id: merge
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          git config user.name "auto-update"
          git config user.email "auto-update@users.noreply.github.com"
          git remote add upstream https://github.com/noskillish/bankmcp.git
          git fetch upstream main
          BRANCH="auto-update/upstream-$(date -u +%Y%m%d)"
          git checkout -B "$BRANCH"
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "Ingen nye upstream-commits."
              exit 0
            fi
            git push -u origin "$BRANCH"
            payload=$(BRANCH="$BRANCH" python3 -c 'import json,os; print(json.dumps({"title": "chore: sync upstream noskillish/bankmcp", "body": "Automatisk upstream-merge. Review egne ændringer (ci.yml, Dockerfile, .cursor) før merge.", "base": "main", "head": os.environ["BRANCH"]}, ensure_ascii=False))')
            body=$(mktemp)
            status=$(curl --fail-with-body -sS -o "$body" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/pulls") || true
            case "$status" in
              201) echo "PR oprettet for $BRANCH." ;;
              422) echo "::notice::PR findes allerede for $BRANCH." ;;
              *)
                echo "::warning::PR kunne ikke oprettes (HTTP ${status:-netværksfejl})."
                cat "$body" || true
                ;;
            esac
            rm -f "$body"
          else
            git merge --abort || true
            echo "::error::Upstream merge-konflikt (noskillish/bankmcp). Manuel sync kræves."
            exit 1
          fi
